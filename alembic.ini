# Alembic config. The database URL is not set here: env.py takes it from `-x url=...`,
# then `sqlalchemy.url` (set programmatically by ai_cost_tracker.db.migrate), then
# ACT_DATABASE_URL via get_settings().

[alembic]
script_location = %(here)s/src/ai_cost_tracker/db/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
